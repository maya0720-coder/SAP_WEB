<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-SAP Webservice 프로토타입 v0.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: 프로토타입 바 + 기기 프레임 안의 앱 셸. 셸·런처 배치는 모두 CSS 변수로 정의하고, 디자인 스킬(data-skill)마다 변수 묶음을 바꿔 같은 화면을 7가지로 비교한다 */
:root{
  --pb-bg:#ffffff; --pb-ink:#1d2320; --pb-muted:#5f6763; --pb-line:#dde1de; --pb-accent:#0d6b4f;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9ecea;color:var(--pb-ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.92em}

/* ---------- 프로토타입 바 ---------- */
.pbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--pb-bg);border-bottom:1px solid var(--pb-line);font-size:13px}
.pbar .ver{font-weight:700;color:var(--pb-accent)}
.pbar nav{display:flex;flex-wrap:wrap;gap:2px}
.pbar nav a{color:var(--pb-muted);text-decoration:none;padding:3px 8px;border-radius:6px}
.pbar nav a[aria-current="page"]{background:var(--pb-ink);color:#fff}
.pbar .grow{flex:1}
.pbar label{display:flex;gap:6px;align-items:center;color:var(--pb-muted)}
.pbar select{border:1px solid var(--pb-line);border-radius:6px;padding:3px 6px;background:#fff}
.pbar .seg{display:inline-flex;border:1px solid var(--pb-line);border-radius:6px;overflow:hidden}
.pbar .seg button{border:0;background:#fff;padding:3px 9px;color:var(--pb-muted)}
.pbar .seg button[aria-pressed="true"]{background:var(--pb-accent);color:#fff}
.pbar :focus-visible{outline:2px solid var(--pb-accent);outline-offset:2px}

.stage{padding:18px 14px 48px;display:flex;justify-content:center}
.device{width:100%;max-width:1320px;container-type:inline-size}
.device[data-device="tablet"]{max-width:1024px;border:10px solid #1d2320;border-radius:26px;overflow:hidden}
.device[data-device="mobile"]{max-width:390px;border:10px solid #1d2320;border-radius:34px;overflow:hidden}

/* ---------- 디자인 스킬 토큰 ---------- */
[data-skill]{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs,14px);
}
[data-skill="fd"]{ /* frontend-design: 장부·도면 느낌, 괘선 목록, 세리프 디스플레이 */
  --bg:#eff1ec;--surface:#fafbf8;--surface-2:#e5e8e1;--ink:#1b231f;--muted:#57605b;--line:#c9cfc6;
  --accent:#b8430f;--accent-ink:#fff;--accent-soft:#f5e1d5;--good:#2f6b3f;--warn:#9a5b00;--bad:#a12a1c;
  --radius:2px;--shadow:none;--font-display:"Hahmlet",Georgia,serif;--font-body:"IBM Plex Sans KR",sans-serif;
  --shell-cols:minmax(0,1fr);--shell-areas:"head" "main";--side-display:none;--headmods-display:flex;--side-w:0;
  --head-bg:var(--bg);--head-border:0 0 2px 0;--head-radius:0;--head-margin:0;
  --l-cols:1fr;--l-gap:0;--mod-dir:row;--mod-align:center;--mod-bg:transparent;--mod-border:0;--mod-rule:1px solid var(--line);--mod-radius:0;--mod-pad:16px 4px;--mod-shadow:none;
  --code-size:34px;--code-font:var(--font-display);--code-w:84px;--code-h:auto;--code-bg:transparent;--code-color:var(--accent);--code-radius:0;
  --feat-span:1;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid var(--line);--card-radius:2px;--card-shadow:none;
  --h1:30px;--h1-weight:700;--ease:ease-out;--press:1;color-scheme:light;
}
[data-skill="uupm"]{ --headbrand-display:none; /* ui-ux-pro-max: SaaS 대시보드형, 사이드바 + 아이콘 카드 */
  --bg:#f4f6fa;--surface:#fff;--surface-2:#eef2f7;--ink:#0f172a;--muted:#5b6678;--line:#e2e8f0;
  --accent:#2563eb;--accent-ink:#fff;--accent-soft:#dbeafe;--good:#15803d;--warn:#b45309;--bad:#b91c1c;
  --radius:12px;--shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06);--font-display:"Gothic A1",sans-serif;--font-body:"Gothic A1",sans-serif;
  --shell-cols:236px minmax(0,1fr);--shell-areas:"side head" "side main";--side-display:flex;--headmods-display:none;--side-label-display:inline;
  --head-bg:var(--surface);--head-border:0 0 1px 0;--head-radius:0;--head-margin:0;
  --l-cols:repeat(3,minmax(0,1fr));--l-gap:14px;--mod-dir:column;--mod-align:flex-start;--mod-bg:var(--surface);--mod-border:1px solid var(--line);--mod-rule:1px solid var(--line);--mod-radius:12px;--mod-pad:18px;--mod-shadow:var(--shadow);
  --code-size:14px;--code-font:var(--font-body);--code-w:42px;--code-h:42px;--code-bg:var(--accent-soft);--code-color:var(--accent);--code-radius:10px;
  --feat-span:1;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid var(--line);--card-radius:12px;--card-shadow:var(--shadow);
  --h1:24px;--h1-weight:800;--ease:ease;--press:1;color-scheme:light;
}
[data-skill="imp"]{ --headbrand-display:none; /* impeccable: OKLCH 틴트 뉴트럴, 카드 남용 없이 간격·괘선으로 구분, 레일 내비 */
  --bg:oklch(0.975 0.006 165);--surface:oklch(0.993 0.003 165);--surface-2:oklch(0.948 0.009 165);--ink:oklch(0.25 0.02 165);--muted:oklch(0.50 0.018 165);--line:oklch(0.89 0.012 165);
  --accent:oklch(0.50 0.10 162);--accent-ink:oklch(0.99 0 0);--accent-soft:oklch(0.94 0.03 162);--good:oklch(0.50 0.12 150);--warn:oklch(0.58 0.13 70);--bad:oklch(0.52 0.17 28);
  --radius:6px;--shadow:none;--font-display:"IBM Plex Sans KR",sans-serif;--font-body:"IBM Plex Sans KR",sans-serif;
  --shell-cols:76px minmax(0,1fr);--shell-areas:"side head" "side main";--side-display:flex;--headmods-display:none;--side-label-display:none;
  --head-bg:var(--bg);--head-border:0;--head-radius:0;--head-margin:0;
  --l-cols:repeat(3,minmax(0,1fr));--l-gap:0 40px;--mod-dir:column;--mod-align:flex-start;--mod-bg:transparent;--mod-border:0;--mod-rule:1px solid var(--line);--mod-radius:0;--mod-pad:18px 0 22px;--mod-shadow:none;
  --code-size:13px;--code-font:var(--font-mono);--code-w:auto;--code-h:auto;--code-bg:transparent;--code-color:var(--accent);--code-radius:0;
  --feat-span:1;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid var(--line);--card-radius:6px;--card-shadow:none;
  --h1:26px;--h1-weight:600;--ease:cubic-bezier(.25,1,.5,1);--press:1;color-scheme:light;
}
[data-skill="taste"]{ /* taste-skill: 단일 강조색, 비대칭 벤토, 큰 라운드 하나로 통일 */
  --bg:#f2f3f3;--surface:#fff;--surface-2:#e9ebeb;--ink:#141414;--muted:#646767;--line:#e0e2e2;
  --accent:#0e7a55;--accent-ink:#fff;--accent-soft:#dff1e9;--good:#0e7a55;--warn:#9a6200;--bad:#b42318;
  --radius:18px;--shadow:none;--font-display:"Gothic A1",sans-serif;--font-body:"Gothic A1",sans-serif;
  --shell-cols:minmax(0,1fr);--shell-areas:"head" "main";--side-display:none;--headmods-display:flex;
  --head-bg:var(--bg);--head-border:0;--head-radius:0;--head-margin:0;
  --l-cols:repeat(4,minmax(0,1fr));--l-gap:12px;--mod-dir:column;--mod-align:flex-start;--mod-bg:var(--surface);--mod-border:1px solid var(--line);--mod-rule:1px solid var(--line);--mod-radius:18px;--mod-pad:22px;--mod-shadow:none;
  --code-size:30px;--code-font:var(--font-display);--code-w:auto;--code-h:auto;--code-bg:transparent;--code-color:var(--ink);--code-radius:0;
  --feat-span:2;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid var(--line);--card-radius:18px;--card-shadow:none;
  --h1:34px;--h1-weight:800;--ease:cubic-bezier(.2,.8,.2,1);--press:.98;color-scheme:light;
}
[data-skill="wdg"]{ --headbrand-display:none; /* web-design-guidelines(검수 기준): 고대비, 큰 터치 영역, 뚜렷한 포커스 */
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f1f1f1;--ink:#111111;--muted:#474747;--line:#bdbdbd;
  --accent:#0b57d0;--accent-ink:#fff;--accent-soft:#e8f0fe;--good:#146c2e;--warn:#8a5300;--bad:#b3261e;
  --radius:8px;--shadow:none;--font-display:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--font-body:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --shell-cols:240px minmax(0,1fr);--shell-areas:"side head" "side main";--side-display:flex;--headmods-display:none;--side-label-display:inline;
  --head-bg:var(--surface);--head-border:0 0 1px 0;--head-radius:0;--head-margin:0;
  --l-cols:repeat(2,minmax(0,1fr));--l-gap:10px;--mod-dir:row;--mod-align:center;--mod-bg:var(--surface);--mod-border:1px solid var(--line);--mod-rule:1px solid var(--line);--mod-radius:8px;--mod-pad:14px 16px;--mod-shadow:none;
  --code-size:15px;--code-font:var(--font-mono);--code-w:52px;--code-h:44px;--code-bg:var(--surface-2);--code-color:var(--ink);--code-radius:6px;
  --feat-span:1;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid var(--line);--card-radius:8px;--card-shadow:none;
  --h1:24px;--h1-weight:700;--ease:ease-out;--press:1;--focus-w:3px;--hit:44px;color-scheme:light;
}
[data-skill="supa"]{ /* supanova: 국내 프리미엄 에이전시풍, 떠 있는 내비, 부드러운 깊이감, 큰 여백 */
  --bg:#edf0f4;--surface:rgba(255,255,255,.78);--surface-2:#e3e8ee;--ink:#0b1220;--muted:#596377;--line:rgba(15,23,42,.08);
  --accent:#0f766e;--accent-ink:#fff;--accent-soft:#d5f2ee;--good:#0f766e;--warn:#a15c07;--bad:#b42318;
  --radius:22px;--shadow:0 1px 1px rgba(15,23,42,.03),0 18px 40px -18px rgba(15,23,42,.22);--font-display:"Gothic A1",sans-serif;--font-body:"Gothic A1",sans-serif;
  --shell-cols:minmax(0,1fr);--shell-areas:"head" "main";--side-display:none;--headmods-display:flex;
  --head-bg:rgba(255,255,255,.72);--head-border:0;--head-radius:999px;--head-margin:12px 16px 0;
  --l-cols:repeat(3,minmax(0,1fr));--l-gap:16px;--mod-dir:column;--mod-align:flex-start;--mod-bg:var(--surface);--mod-border:1px solid rgba(255,255,255,.9);--mod-rule:1px solid rgba(255,255,255,.9);--mod-radius:22px;--mod-pad:26px;--mod-shadow:var(--shadow);
  --code-size:13px;--code-font:var(--font-body);--code-w:auto;--code-h:auto;--code-bg:var(--accent-soft);--code-color:var(--accent);--code-radius:999px;
  --feat-span:2;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid rgba(255,255,255,.9);--card-radius:22px;--card-shadow:var(--shadow);
  --h1:36px;--h1-weight:800;--ease:cubic-bezier(.16,1,.3,1);--press:.98;color-scheme:light;
}
[data-skill="emil"]{ --headbrand-display:none; /* emil-design-eng(추천): 매일 쓰는 도구, 다크 기본, 촘촘함, 누름 피드백·짧은 전환 */
  --bg:#0b0b0d;--surface:#131316;--surface-2:#1b1b1f;--ink:#ececef;--muted:#8d8d96;--line:#26262b;
  --accent:#5b8dff;--accent-ink:#0b0b0d;--accent-soft:#17243f;--good:#4cc38a;--warn:#e5a93b;--bad:#ff6b5e;
  --radius:8px;--shadow:none;--font-display:"IBM Plex Sans KR",sans-serif;--font-body:"IBM Plex Sans KR",sans-serif;--fs:13.5px;
  --shell-cols:64px minmax(0,1fr);--shell-areas:"side head" "side main";--side-display:flex;--headmods-display:none;--side-label-display:none;
  --head-bg:var(--bg);--head-border:0 0 1px 0;--head-radius:0;--head-margin:0;
  --l-cols:repeat(3,minmax(0,1fr));--l-gap:8px;--mod-dir:row;--mod-align:center;--mod-bg:var(--surface);--mod-border:1px solid var(--line);--mod-rule:1px solid var(--line);--mod-radius:8px;--mod-pad:12px 14px;--mod-shadow:none;
  --code-size:12px;--code-font:var(--font-mono);--code-w:34px;--code-h:26px;--code-bg:var(--surface-2);--code-color:var(--ink);--code-radius:6px;
  --feat-span:1;--feat-rspan:1;--card-bg:var(--surface);--card-border:1px solid var(--line);--card-radius:10px;--card-shadow:none;
  --h1:20px;--h1-weight:600;--ease:cubic-bezier(.23,1,.32,1);--press:.97;color-scheme:dark;
}

/* ---------- 앱 셸 ---------- */
.app{display:grid;grid-template-columns:var(--shell-cols);grid-template-areas:var(--shell-areas);min-height:720px;position:relative}
.app :focus-visible{outline:var(--focus-w,2px) solid var(--accent);outline-offset:2px}
.head{grid-area:head;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--head-bg);border-style:solid;border-color:var(--line);border-width:var(--head-border);border-radius:var(--head-radius);margin:var(--head-margin);min-width:0}
[data-skill="supa"] .head{backdrop-filter:blur(14px);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;text-decoration:none;color:inherit;font-family:var(--font-display)}
.brand i{width:26px;height:26px;border-radius:calc(var(--radius) * .6);background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px}
.head .brand{display:var(--headbrand-display,flex)}
.headmods{display:var(--headmods-display);gap:2px;overflow-x:auto;min-width:0}
.headmods a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:calc(var(--radius) * .6);white-space:nowrap;font-weight:500}
.headmods a b{font-family:var(--font-mono);font-size:11.5px;margin-right:4px;color:inherit}
.headmods a.on{color:var(--ink);background:var(--surface-2)}
[data-skill="fd"] .headmods a.on{background:transparent;color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.search{flex:1;min-width:120px;max-width:340px;margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--radius) * .8);padding:6px 10px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.inbox-btn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--radius) * .8);padding:6px 10px;white-space:nowrap;text-decoration:none;color:inherit;min-height:var(--hit,auto);display:flex;align-items:center;gap:6px}
.inbox-btn .badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.me{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px}
.me .role{font-size:11px;color:var(--muted)}

.side{grid-area:side;display:var(--side-display);flex-direction:column;gap:2px;padding:12px 10px;border-right:1px solid var(--line);background:var(--bg);position:sticky;top:0;align-self:start;min-height:720px}
[data-skill="uupm"] .side,[data-skill="wdg"] .side{background:var(--surface)}
.side .brand{margin:4px 6px 14px}
.side a.sm{display:flex;align-items:center;gap:10px;padding:8px;border-radius:calc(var(--radius) * .7);text-decoration:none;color:var(--muted);min-height:var(--hit,36px)}
.side a.sm b{font-family:var(--font-mono);font-size:12px;min-width:26px;text-align:center;color:var(--ink)}
.side a.sm span{display:var(--side-label-display,inline)}
.side a.sm.on{background:var(--surface-2);color:var(--ink)}
.side a.sm.on b{color:var(--accent)}
.side a.sm.off{opacity:.38}
.side .sep{height:1px;background:var(--line);margin:8px 4px}
.side .label{font-size:11px;color:var(--muted);padding:4px 8px;display:var(--side-label-display,block)}
[data-skill="imp"] .side .brand span,[data-skill="emil"] .side .brand span{display:none}
[data-skill="imp"] .side a.sm,[data-skill="emil"] .side a.sm{justify-content:center}

.main{grid-area:main;padding:24px 28px 40px;min-width:0}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb a{color:inherit}
.ptitle{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.ptitle h1{font-family:var(--font-display);font-size:var(--h1);font-weight:var(--h1-weight);letter-spacing:-.02em;line-height:1.2}
.ptitle p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.sec-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sample{font-size:11.5px;color:var(--warn);border:1px dashed currentColor;border-radius:6px;padding:1px 7px;white-space:nowrap}
.card{background:var(--card-bg);border:var(--card-border);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:16px}
[data-skill="supa"] .card,[data-skill="supa"] .mod{backdrop-filter:blur(10px)}
.card h2{font-size:14.5px;margin-bottom:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--radius) * .8);padding:7px 13px;font-weight:600;min-height:var(--hit,auto);transition:transform .16s var(--ease),background .16s var(--ease);text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(var(--press))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill.w1{background:var(--accent-soft);color:var(--accent)}
.pill.w2{border-color:var(--accent);color:var(--accent)}
.pill.pl{background:var(--surface-2);color:var(--muted)}
.pill.gui{border-color:var(--line);color:var(--muted)}
.pill.wait{color:var(--warn);border-color:var(--warn)}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.no{color:var(--bad);border-color:var(--bad)}
.note{font-size:12px;color:var(--muted)}

/* ---------- 홈 ---------- */
.tasks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.task{display:flex;flex-direction:column;gap:2px;padding:14px 16px;text-decoration:none;color:inherit}
.task .k{font-size:12px;color:var(--muted)}
.task .v{font-size:24px;font-weight:700;font-family:var(--font-display);letter-spacing:-.02em}
.task .d{font-size:11.5px;color:var(--muted)}
[data-skill="imp"] .tasks,[data-skill="fd"] .tasks{gap:0}
[data-skill="imp"] .task,[data-skill="fd"] .task{background:transparent;border:0;border-radius:0;box-shadow:none;border-left:1px solid var(--line);padding:4px 16px}
[data-skill="imp"] .task:first-child,[data-skill="fd"] .task:first-child{border-left:0;padding-left:0}
.pins{display:flex;flex-wrap:wrap;gap:8px}
.launcher{display:grid;grid-template-columns:var(--l-cols);gap:var(--l-gap)}
.mod{display:flex;flex-direction:var(--mod-dir);align-items:var(--mod-align);gap:12px;background:var(--mod-bg);border:var(--mod-border);border-radius:var(--mod-radius);padding:var(--mod-pad);box-shadow:var(--mod-shadow);text-decoration:none;color:inherit;min-width:0;transition:transform .18s var(--ease),border-color .18s var(--ease);position:relative}
[data-skill="fd"] .mod,[data-skill="imp"] .mod{border-top:var(--mod-rule)}
.mod:active{transform:scale(var(--press))}
.mod:hover{border-color:var(--accent)}
.mod.feat{grid-column:span var(--feat-span);grid-row:span var(--feat-rspan)}
.mod .code{font-family:var(--code-font);font-size:var(--code-size);font-weight:700;width:var(--code-w);height:var(--code-h);background:var(--code-bg);color:var(--code-color);border-radius:var(--code-radius);display:inline-grid;place-items:center;flex:none;letter-spacing:.02em}
[data-skill="supa"] .mod .code{padding:3px 10px}
.mod .mb{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mod .mn{font-weight:700;font-size:15px;font-family:var(--font-display)}
.mod .md{font-size:12.5px;color:var(--muted)}
.mod .mm{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.mod .mm b{color:var(--accent)}
.mod.off{opacity:.42}
.mod.off::after{content:"권한 없음";position:absolute;top:10px;right:12px;font-size:10.5px;color:var(--muted)}
[data-skill="fd"] .mod .mm{margin:0 0 0 auto}
[data-skill="taste"] .mod.feat .mn,[data-skill="supa"] .mod.feat .mn{font-size:24px}
[data-skill="taste"] .mod.feat{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[data-skill="taste"] .mod.feat .md,[data-skill="taste"] .mod.feat .mm{color:color-mix(in srgb,var(--bg) 70%,transparent)}
[data-skill="taste"] .mod.feat .code{color:var(--bg)}
[data-skill="taste"] .mod.feat .mm b{color:#7fe0b8}
[data-skill="supa"] .mod.feat{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(213,242,238,.8))}


/* ---------- MAIN 대시보드 ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px}
.dash>*{min-width:0}
.w12{grid-column:span 12}.w8{grid-column:span 8}.w4{grid-column:span 4}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wh h2{margin:0}
.wh a,.wh button.lnk{font-size:12px;color:var(--accent);background:none;border:0;padding:0;text-decoration:none}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.fav{position:relative;display:flex;flex-direction:column;gap:3px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:calc(var(--radius) * .9);background:var(--surface);text-decoration:none;color:inherit;min-height:92px;transition:transform .16s var(--ease),border-color .16s var(--ease)}
.fav:hover{border-color:var(--accent)}
.fav:active{transform:scale(var(--press))}
.fav .fc{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600}
.fav .fn{font-weight:700;font-size:14px}
.fav .fp{font-size:11.5px;color:var(--muted)}
.fav .fb{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.fav .fx{position:absolute;top:6px;right:6px;display:none;gap:3px}
.editing .fav{border-style:dashed}
.editing .fav .fx{display:flex}
.editing .fav .fb{display:none}
.fx button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font-size:11px;padding:1px 6px;min-width:24px}
.fav.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);cursor:pointer;font:inherit;font-weight:600}
.star{border:0;background:transparent;font-size:17px;line-height:1;color:var(--muted);padding:2px 6px;cursor:pointer}
.star.on{color:#d99a00}
.wlist{list-style:none;margin:0;padding:0;display:grid}
.wlist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.wlist li:last-child{border-bottom:0}
.wlist .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wlist a{color:inherit;text-decoration:none}
.steps4{display:inline-flex;gap:3px;vertical-align:middle}
.steps4 i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.steps4 i.on{background:var(--accent)}
.steps4 i.bad{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:12px;height:132px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;justify-content:flex-end}
.bars b{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.45}
.bars div.cur b{opacity:1}
.bars span.v{font-weight:700;color:var(--ink);font-size:12px}
.pick{display:grid;gap:12px;max-height:60vh;overflow:auto}
.pick h3{font-size:12.5px;color:var(--muted);margin:0 0 4px}
.pick label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
@container (max-width:1100px){.w8,.w4{grid-column:span 12}}
@container (max-width:720px){.favs{grid-template-columns:repeat(2,minmax(0,1fr))}.fav{min-height:80px;padding:12px}}

/* ---------- 모듈 화면 ---------- */
.subs{display:grid;gap:22px}
.sub h3{font-size:14px;font-family:var(--font-display);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.sub h3 small{font-weight:400;color:var(--muted);font-size:12px}
.prog{display:grid;grid-template-columns:minmax(0,1fr) 120px 96px 120px;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:calc(var(--radius) * .8);background:var(--surface);margin-bottom:6px;min-height:var(--hit,auto)}
[data-skill="fd"] .prog,[data-skill="imp"] .prog{border-width:0 0 1px 0;border-radius:0;background:transparent;margin:0;padding-left:0}
.prog .pn{font-weight:600}
.prog .pd{font-size:12px;color:var(--muted)}
.prog.lock{opacity:.5}
.prog .go{justify-self:end;display:flex;align-items:center;gap:2px}

/* ---------- 표 ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
[data-skill="fd"] th,[data-skill="imp"] th{background:transparent;border-bottom:1px solid var(--ink)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700}
.in{border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--radius) * .6);padding:5px 7px;min-width:0;width:100%}
td .in{width:auto}
.in.r{text-align:right}
.in.err{border-color:var(--bad)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- 발주서 ---------- */
.order{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px;align-items:start}
.ostack{display:grid;gap:14px;min-width:0}
.ostack>*,.summary>*,.split>*,.board>*{min-width:0}
.anchors{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.anchors a{font-size:12.5px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.anchors a b{color:var(--accent);margin-right:4px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11.5px;color:var(--muted);font-weight:500}
.f label i{color:var(--bad);font-style:normal}
.f.s2{grid-column:span 2}
.f.s4{grid-column:1/-1}
.f .h{font-size:11px;color:var(--muted)}
.row{display:flex;gap:6px;align-items:center}
details.hd>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.hd>summary::-webkit-details-marker{display:none}
details.hd>summary .sumline{font-size:12.5px;color:var(--muted);font-weight:400}
details.hd[open] .sumline{display:none}
.summary{position:sticky;top:12px;display:grid;gap:12px}
.sumtbl td,.sumtbl th{padding:6px 6px;font-size:12.5px}
.sumtbl td:first-child{white-space:normal}
.sumtbl tr.zero td{color:var(--muted);opacity:.6}
.sumtbl .in{width:100px;padding:3px 5px}
.flow-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--accent-soft);color:var(--accent);padding:8px 10px;border-radius:calc(var(--radius) * .7)}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.totals .big{font-size:20px;font-weight:700;font-family:var(--font-display)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px}
.bottom-bar{display:none}

/* ---------- 결재함 ---------- */
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:calc(var(--radius) * .8);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 11px;border-radius:calc(var(--radius) * .6);font-weight:600;color:var(--muted);min-height:var(--hit,auto)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .c{font-size:11px;color:var(--warn);margin-left:3px}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.sel td{background:var(--accent-soft)}
tr[data-no]{cursor:pointer}
.up{color:var(--bad)} .down{color:var(--good)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:12.5px}
.tl li{display:grid;grid-template-columns:12px 1fr;gap:8px}
.tl .d{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:4px}
.tl .d.on{background:var(--accent)}
.cards{display:none;gap:8px}

/* ---------- 배송 ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.board{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.route{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:calc(var(--radius) * .8)}
.veh{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}
.veh:last-child{border-bottom:0}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.late{background:var(--warn)}
.stop{display:grid;gap:8px}
.stop .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stop .acts .btn{justify-content:center;padding:10px 0}
.seq{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none}

/* ---------- 로그인 ---------- */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:640px}
.login .l{background:var(--ink);color:var(--bg);padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login .l h1{font-family:var(--font-display);font-size:32px;line-height:1.25;letter-spacing:-.03em}
.login .l p{opacity:.8;max-width:38ch}
.login .l ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.login .l li{display:flex;gap:10px;align-items:baseline}
.login .l li b{font-family:var(--font-mono);font-size:12px;opacity:.7;min-width:22px}
.login .r{display:grid;place-items:center;padding:40px 24px;background:var(--surface)}
.login .box{width:100%;max-width:340px;display:grid;gap:14px}
.sso{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px;border-radius:calc(var(--radius) * .8);background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:15px;transition:transform .16s var(--ease)}
.sso:active{transform:scale(var(--press))}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center}
.steps3 span{border:1px dashed var(--line);border-radius:6px;padding:5px 2px}

/* ---------- 비교 ---------- */
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.cmpc{background:#fff;border:1px solid var(--pb-line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;color:var(--pb-ink);font-family:"IBM Plex Sans KR",sans-serif}
.cmpc .thumb{height:262px;overflow:hidden;border-bottom:1px solid var(--pb-line);position:relative;background:#ddd}
.cmpc .thumb .mini{width:1200px;transform:scale(.345);transform-origin:top left;pointer-events:none}
.cmpc .thumb .mini .app{min-height:735px}
.cmpc .body{padding:14px 16px;display:grid;gap:8px;font-size:12.5px}
.cmpc h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cmpc h3 small{font-weight:400;color:var(--pb-muted);font-size:11.5px}
.cmpc ul{margin:0;padding-left:16px;display:grid;gap:3px}
.cmpc .fit{display:flex;gap:8px;align-items:center}
.cmpc .fit b{font-size:11.5px;padding:1px 8px;border-radius:99px;background:#eef3f0;color:var(--pb-accent)}
.cmpc .fit b.lo{background:#f6eee6;color:#8a4b12}
.cmpc .acts{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:4px}
.cmpc a{color:var(--pb-accent)}
.cmpc .use{border:1px solid var(--pb-ink);background:var(--pb-ink);color:#fff;border-radius:6px;padding:5px 10px;font-size:12px}
.cmp-head{background:#fff;border:1px solid var(--pb-line);border-radius:10px;padding:16px 18px;margin-bottom:16px;color:var(--pb-ink);display:grid;gap:6px;font-size:13px}
.cmp-head h1{font-size:22px}
.cmp-wrap{padding:22px;background:#f4f5f4;min-height:720px}

/* ---------- 다이얼로그·토스트 ---------- */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:60;padding:16px}
.dlg.on{display:grid}
.dlg .box{background:var(--surface);color:var(--ink);border-radius:var(--card-radius);padding:20px;width:100%;max-width:420px;display:grid;gap:10px;border:1px solid var(--line)}
.dlg textarea{min-height:90px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:70;max-width:90vw}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 반응형(프레임 폭 기준) ---------- */
@container (max-width:1100px){
  .order{grid-template-columns:1fr}
  .summary{position:static}
  .split{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .launcher{grid-template-columns:repeat(2,minmax(0,1fr))}
  [data-skill="fd"] .launcher{grid-template-columns:1fr}
  .mod.feat{grid-column:span 2;grid-row:span 1}
  [data-skill="fd"] .mod.feat{grid-column:auto}
}
@container (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main"}
  .head .brand{display:flex}
  .side{display:none}
  .head{flex-wrap:wrap;gap:8px;padding:10px 12px;margin:0;border-radius:0}
  .headmods{display:flex;order:5;flex-basis:100%}
  .search{display:none}
  .me .nm{display:none}
  .main{padding:16px 14px 90px}
  .tasks,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .launcher{grid-template-columns:1fr}
  .mod.feat{grid-column:auto}
  .fields{grid-template-columns:1fr}
  .f.s2{grid-column:auto}
  .prog{grid-template-columns:1fr auto}
  .prog .tc,.prog .st{display:none}
  .login{grid-template-columns:1fr}
  .login .l{padding:26px 22px}
  .login .l ul{display:none}
  .tblv{display:none}
  .cards{display:grid}
  .bottom-bar{display:flex;position:sticky;bottom:0;margin:12px -14px -90px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line);justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
}
</style>
</head>
<body>

<div class="pbar" role="region" aria-label="프로토타입 조작">
  <span class="ver">G-SAP v0.5</span>
  <nav id="pnav" aria-label="화면 이동">
    <a href="#login">로그인</a><a href="#home">MAIN 대시보드</a><a href="#m-sd">SD 모듈</a><a href="#p-order">발주서 등록</a><a href="#inbox">통합 결재함</a><a href="#m-le">LE 모듈</a><a href="#p-delivery">배송 현황</a><a href="#p-driver">기사 화면</a><a href="#compare">디자인 스킬 비교</a>
  </nav>
  <span class="grow"></span>
  <label for="skillSel">디자인
    <select id="skillSel">
      <option value="imp">impeccable</option>
      <option value="fd">frontend-design</option>
      <option value="uupm">ui-ux-pro-max</option>
      <option value="taste">taste-skill</option>
      <option value="wdg">web-design-guidelines</option>
      <option value="supa">supanova</option>
      <option value="emil">emil-design-eng (추천)</option>
    </select>
  </label>
  <div class="seg" role="group" aria-label="기기">
    <button type="button" data-dev="desktop" aria-pressed="true">데스크톱</button><button type="button" data-dev="tablet" aria-pressed="false">태블릿</button><button type="button" data-dev="mobile" aria-pressed="false">모바일</button>
  </div>
  <label for="roleSel">역할
    <select id="roleSel">
      <option value="sales">영업사원</option><option value="approver">결재자</option><option value="scm">SCM 담당</option><option value="driver">배송기사</option><option value="admin">IT 관리자</option>
    </select>
  </label>
</div>

<div class="stage"><div class="device" id="device" data-device="desktop"><div id="root"></div></div></div>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="box" id="dlgBox">
    <h2 id="dlgT" style="font-size:16px">반려 사유</h2>
    <p class="note" id="dlgD" style="margin:0"></p>
    <label for="dlgR" class="note">사유 (필수, 5자 이상)</label>
    <textarea id="dlgR" class="in"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="dlgC">취소</button><button class="btn bad" type="button" id="dlgO">반려</button></div>
  </div>
</div>
<div class="dlg" id="favDlg" role="dialog" aria-modal="true" aria-labelledby="favT">
  <div class="box" id="favBox">
    <h2 id="favT" style="font-size:16px">즐겨찾기 추가</h2>
    <p class="note" style="margin:0">내 SAP 역할에서 열 수 있는 웹 프로그램만 보입니다. 별을 눌러 추가하거나 뺍니다.</p>
    <div class="pick" id="favPick"></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn pri" type="button" id="favClose">완료</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

      <div class="acts"><a href="${s.src}" target="_blank" rel="noopener">출처</a><button class="use" type="button" data-use="${s.k}">이 스타일로 전체 보기</button></div></div></article>`;
  }).join('');
  return `<div class="cmp-wrap"><div class="cmp-head"><h1>디자인 스킬 7종 레이아웃 비교</h1>
  <p style="margin:0">같은 MAIN 대시보드(즐겨찾기·위젯·모듈 런처)를 스킬별 공개 원칙에 맞춰 다시 그렸습니다. 썸네일은 현재 선택한 역할 기준입니다. 상단 '디자인'에서 고르면 모든 화면이 그 스타일로 바뀝니다.</p>
  <p class="note" style="margin:0;color:#8a4b12">주의: 각 스킬을 실제로 설치·실행한 결과가 아니라, 공개된 설명을 제가 해석해 만든 미리보기입니다. 적합도는 제 의견입니다.</p>
  <p style="margin:0"><b>권고:</b> impeccable로 만들고 다듬기 → web-design-guidelines로 검수 → emil-design-eng로 결재·입력 인터랙션 마감.</p></div>
  <div class="cmp">${cards}</div></div>`;
}

/* ===== 라우터 ===== */
let curHash = '';
function render(){
  const h = (location.hash || '#home').slice(1);
  curHash = h;
  $$('#pnav a').forEach(a => a.getAttribute('href') === '#' + h ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  const root = $('#root');
  if (h === 'login') { root.innerHTML = loginBody(); return; }
  if (h === 'compare') { root.innerHTML = compareBody(); return; }
  let cur = 'home', body = '', after = null;
  if (h === 'home') body = homeBody();
  else if (h.startsWith('m-')) { cur = h.slice(2); const m = MODULES.find(x => x.k === cur); body = m && modAllowed(m) ? moduleBody(cur) : deniedBody(); }
  else if (h === 'inbox') { cur = 'inbox'; body = can('inbox') ? inboxBody() : deniedBody(); if (can('inbox')) after = renderInbox; }
  else if (h === 'p-price' || h === 'sd-price') { location.hash = 'inbox'; return; }
  else if (PROGS[h]) {
    cur = PROGS[h].mod.k;
    if (!can(h)) body = deniedBody();
    else if (h === 'p-order') { body = orderBody(); after = mountOrder; }
    else if (h === 'p-delivery') body = deliveryBody();
    else if (h === 'p-driver') body = driverBody();
    else body = wipBody(h);
  } else body = deniedBody();
  const rid = h === 'inbox' ? 'inbox' : (PROGS[h] ? h : null);
  if (rid && favable(rid)) { const i = RECENT.indexOf(rid); if (i >= 0) RECENT.splice(i, 1); RECENT.unshift(rid); RECENT.length = Math.min(RECENT.length, 5); }
  root.innerHTML = shell(cur, body);
  if (after) after();
}

/* ===== 이벤트 ===== */
function renderPick(){
  const groups = MODULES.map(m => { const ids = m.subs.flatMap(s => s.progs).map(p => p.id).filter(favable); return ids.length ? `<div><h3>${m.code} ${esc(m.name)}</h3>${ids.map(id => `<label><span>${esc(favMeta(id).name)} <span class="note mono">${esc(favMeta(id).tc)}</span></span>${starBtn(id)}</label>`).join('')}</div>` : ''; }).join('');
  const inb = favable('inbox') ? `<div><h3>모듈 공통</h3><label><span>통합 결재함</span>${starBtn('inbox')}</label></div>` : '';
  $('#favPick').innerHTML = inb + groups;
}
document.addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-star]');
  if (st) { e.preventDefault(); e.stopPropagation(); const id = st.dataset.star; toggleFav(id); toast(isFav(id) ? '즐겨찾기에 추가했습니다.' : '즐겨찾기에서 뺐습니다.'); if ($('#favDlg').classList.contains('on')) renderPick(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.closest('#favAdd') || t.closest('#favAdd2')) { e.preventDefault(); $('#favBox').setAttribute('data-skill', skill); renderPick(); $('#favDlg').classList.add('on'); return; }
  if (t.closest('#favClose')) { $('#favDlg').classList.remove('on'); return; }
  if (t.closest('#favEditBtn')) { favEdit = !favEdit; render(); return; }
  const mv = t.closest('[data-favmv]');
  if (mv) { e.preventDefault(); const vis = loadFav(role).filter(favable); const i = Number(mv.dataset.favmv), j = i + Number(mv.dataset.dir); if (j < 0 || j >= vis.length) return; [vis[i], vis[j]] = [vis[j], vis[i]]; const hid = loadFav(role).filter(x => !favable(x)); FAV[role] = vis.concat(hid); saveFav(role); render(); return; }
  if (favEdit && t.closest('.fav')) { e.preventDefault(); return; }
  const jump = t.closest('[data-jump]');
  if (jump) { e.preventDefault(); const el = document.getElementById(jump.dataset.jump); if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); } return; }
  const use = t.closest('[data-use]');
  if (use) { skill = use.dataset.use; $('#skillSel').value = skill; location.hash = 'home'; render(); return; }
  if (t.closest('#sso')) { toast('fs.golfzon.com → MFA → SAP 역할 확인 (시뮬레이션)'); location.hash = 'home'; return; }
  if (t.closest('#addItem')) { ITEMS.push({sys:'TV PLUS', mat:'(선택)', model:'(모델 검색)', qty:1, price:0, pm:0, rack:''}); mountOrder(); return; }
  const del = t.closest('[data-del]');
  if (del) { ITEMS.splice(Number(del.dataset.del), 1); mountOrder(); return; }
  if (t.closest('#oSave')) { toast('서버에 임시저장했습니다. 다른 기기에서 이어서 작성할 수 있습니다.'); orderState = '임시저장'; const s = $('#oState'); if (s) { s.textContent = '임시저장 ' + new Date().toTimeString().slice(0,5); } return; }
  if (t.closest('#oSubmit')) { orderState = 'SAP 9229 · 상신됨'; const s = $('#oState'); if (s) { s.textContent = orderState; s.className = 'pill w1'; } toast('SAP 발주서 9229 생성, 결재 상신 (예시)'); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { inboxTab = tab.dataset.tab; sel.clear(); renderInbox(); return; }
  const chk = t.closest('[data-chk]');
  if (chk) { e.stopPropagation(); chk.checked ? sel.add(chk.dataset.chk) : sel.delete(chk.dataset.chk); renderInbox(); return; }
  if (t.closest('#chkAll')) { const on = t.checked; sel.clear(); if (on) visibleAppr().filter(r => r.st === 'wait').forEach(r => sel.add(r.no)); renderInbox(); return; }
  const row = t.closest('[data-no]');
  if (row && $('#idetail')) { focusNo = row.dataset.no; renderInbox(); return; }
  if (t.closest('#bApp')) { decide([...sel], 'ok'); return; }
  if (t.closest('#bRej')) { askReject([...sel]); return; }
  const one = t.closest('[data-one]');
  if (one) { one.dataset.one === 'ok' ? decide([focusNo], 'ok') : askReject([focusNo]); return; }
  const act = t.closest('[data-act]');
  if (act) { const s = STOPS[Number(act.dataset.stop)], j = Number(act.dataset.act); s.t[j] = new Date().toTimeString().slice(0,5); s.st = j + 1; toast(`${ACT[j]} 기록 · 위치 1회 수집 (시뮬레이션) · SAP 배송상태 갱신`); render(); return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  const tr = el.closest && el.closest('#itemTbl tr[data-i]');
  if (tr && el.dataset.f) {
    const it = ITEMS[Number(tr.dataset.i)];
    if (el.dataset.f === 'sys') it.sys = el.value; else it[el.dataset.f] = Math.max(0, toNum(el.value));
    tr.querySelector('[data-final]').textContent = won(it.qty * it.price - it.pm);
    renderSummary(); return;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.dep) { payOf(el.dataset.dep).dep = Math.max(0, toNum(el.value)); renderSummary(); }
  if (el.closest && el.closest('#itemTbl') && el.dataset.f && el.dataset.f !== 'sys') { el.value = el.dataset.f === 'qty' ? toNum(el.value) : won(toNum(el.value)); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { const q = $('#q'); if (q) { e.preventDefault(); q.focus(); } }
  if (e.key === 'Escape') { $('#dlg').classList.remove('on'); $('#favDlg').classList.remove('on'); }
  if (e.key === 'Enter' && e.target.id === 'q') {
    const v = e.target.value.trim().toLowerCase(); if (!v) return;
    const hit = Object.values(PROGS).find(p => p.name.toLowerCase().includes(v) || p.tc.toLowerCase().includes(v) || p.mod.code.toLowerCase() === v);
    if (hit) location.hash = hit.id === 'sd-price' || hit.id === 'p-price' ? 'inbox' : hit.id; else toast('일치하는 프로그램이 없습니다.');
  }
});
$('#dlgC').addEventListener('click', () => $('#dlg').classList.remove('on'));
$('#dlgO').addEventListener('click', () => { if ($('#dlgR').value.trim().length < 5) { toast('반려 사유를 5자 이상 입력하세요.'); return; } $('#dlg').classList.remove('on'); decide(pendingRej, 'no'); });
$('#skillSel').addEventListener('change', e => { skill = e.target.value; render(); });
$('#roleSel').addEventListener('change', e => { role = e.target.value; sel.clear(); inboxTab = 'all'; favEdit = false; RECENT.length = 0; render(); });
$$('.pbar .seg button').forEach(b => b.addEventListener('click', () => { $$('.pbar .seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('#device').dataset.device = b.dataset.dev; }));
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
